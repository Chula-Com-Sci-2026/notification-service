name: notification-service

x-service: &service
  build: .
  image: notification-service:local
  env_file: .env
  environment:
    POSTGRES_SERVER: db
    POSTGRES_PORT: 5432
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: 5672

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5433}:5432
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.3.6-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - 127.0.0.1:${RABBITMQ_PORT:-5673}:5672
      - 127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15673}:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 10s
      retries: 20

  migrate:
    <<: *service
    # The Alpine image has no bash, so the script's interpreter is named here.
    command: [sh, scripts/prestart.sh]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *service
    ports:
      - 127.0.0.1:${API_PORT:-8010}:8000
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8000/up]
      interval: 3s
      timeout: 3s
      retries: 20

  consumer:
    <<: *service
    command: [python, -m, app.consumer]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [CMD, test, -f, /tmp/notification-consumer-ready]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
  rabbitmq-data:
